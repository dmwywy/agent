# rules/fields.yaml
# 字段字典：全组唯一的标准科目清单。
# 用途：
#   1. 解析侧（A）按此清单填 item_code；
#   2. 模型侧（信工）用它作为 standard_items 与 match_claim 的 fields 白名单；
#   3. 规则侧（B）按此清单取数、换算、比对。
# 约定：
#   - 所有 amount 类型的值一律为十进制字符串，不使用浮点数；
#   - 换算由规则侧按 unit_raw 执行，解析侧不换算；
#   - source 为 NOTE 的字段必须给出 note_ref（附注条目位置），否则无法定位证据；
#   - period_type 只能取 FY / YTD / BAL_END / BAL_BEG 四值之一；
#   - 修改任何 code 需升版本号并通知全组（会同时影响 rules.yaml 与缓存）。

version: "1.0"

# ============================================================
# 命名规则
# ============================================================
# BS_   资产负债表
# IS_   利润表
# CF_   现金流量表
# EQ_   所有者权益变动表
# NT_   附注明细（与主表对应项分别建码）
# MD_   管理层讨论与分析中的分项披露
# RP_   研报引用值（来自模拟研报，不来自财报）
# SH_   股本类
# DV_   分红类

