# rules/fields.yaml  —— 全项目字段字典：A 按此提数，B 按此取数，模型按此返回 item_code
# 约定期：amount 类型的值一律为字符串形式的十进制数，禁止浮点；source=NOTE 时必须带 note_ref
version: "1.0"

fields:
  # ---- 资产负债表 ----
  TOTAL_ASSETS:      {zh: 资产总计,          type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  TOTAL_LIAB:        {zh: 负债合计,          type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  TOTAL_EQUITY:      {zh: 所有者权益合计,    type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  EQUITY_PARENT:     {zh: 归属母公司所有者权益, type: amount, statement: BS, period: BAL_END, source: MAIN,  core: true}
  EQUITY_MINORITY:   {zh: 少数股东权益,      type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  CURRENT_ASSETS:    {zh: 流动资产合计,      type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  CURRENT_LIAB:      {zh: 流动负债合计,      type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  CASH_END:          {zh: 货币资金期末,      type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  CASH_BEG:          {zh: 货币资金期初,      type: amount,  statement: BS,  period: BAL_BEG, source: MAIN,  core: true}
  AR_NET:            {zh: 应收账款,          type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  INVENTORY:         {zh: 存货,              type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: true}
  FIXED_ASSETS:      {zh: 固定资产（净额）,  type: amount,  statement: BS,  period: BAL_END, source: MAIN,  core: false}

  # ---- 利润表 ----
  TOTAL_REVENUE:     {zh: 营业总收入,        type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  REVENUE:           {zh: 营业收入,          type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  OPERATING_COST:    {zh: 营业成本,          type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  OPERATING_PROFIT:  {zh: 营业利润,          type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  TOTAL_PROFIT:      {zh: 利润总额,          type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  INCOME_TAX:        {zh: 所得税费用,        type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  NET_PROFIT:        {zh: 净利润,            type: amount,  statement: IS,  period: FY,      source: MAIN,  core: true}
  NP_PARENT:         {zh: 归属母公司股东的净利润, type: amount, statement: IS, period: FY,    source: MAIN,  core: true}

  # ---- 现金流量表 ----
  CF_OPERATING:      {zh: 经营活动产生的现金流量净额, type: amount, statement: CF, period: FY, source: MAIN, core: true}
  CF_NET_INCREASE:   {zh: 现金及现金等价物净增加额,   type: amount, statement: CF, period: FY, source: MAIN, core: true}
  CASH_EQ_END:       {zh: 期末现金及现金等价物余额,   type: amount, statement: CF, period: BAL_END, source: MAIN, core: true}

  # ---- 附注来源（必须带 note_ref，否则无法定位证据）----
  CASH_ON_HAND:      {zh: 库存现金,          type: amount,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "附注七、1 货币资金", core: false}
  CASH_IN_BANK:      {zh: 银行存款,          type: amount,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "附注七、1 货币资金", core: false}
  CASH_OTHER:        {zh: 其他货币资金,      type: amount,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "附注七、1 货币资金", core: false}
  AR_GROSS:          {zh: 应收账款账面余额,  type: amount,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "附注七、5 应收账款", core: false}
  AR_BADDEBT:        {zh: 坏账准备,          type: amount,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "附注七、5 应收账款", core: false}
  REVENUE_MOUTAI:    {zh: 茅台酒营业收入,    type: amount,  statement: MDNA, period: FY,      source: MDNA, note_ref: "第三节 主营业务分产品", core: false}
  REVENUE_SERIES:    {zh: 系列酒营业收入,    type: amount,  statement: MDNA, period: FY,      source: MDNA, note_ref: "第三节 主营业务分产品", core: false}
  TOTAL_SHARES:      {zh: 总股本,            type: shares,  statement: NOTE, period: BAL_END, source: NOTE, note_ref: "第一节 重要提示", core: false}

# 规则引擎使用约束（写进代码断言）：
# 1. type=amount 的值禁止转 float；参与计算前一律 Decimal(str(v))
# 2. source=NOTE 或 MDNA 的字段，记录中必须带 note_ref 与 page，否则不得进入核查
# 3. missing 表示"未披露"：不写入 JSON，不要用 null 或 0 表示