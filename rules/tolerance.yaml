# rules/tolerance.yaml
# 有效容差 = max(abs 下限, rel * max(|左值|, |右值|))，并对"按披露单位"再取下限
# floor_by_unit=true 时，下限不得低于半个披露单位（元=0.5、千元=500、万元=5000、百万元=5万、亿元=50万）
version: "1.0"

profiles:
  MAIN_TABLE:   {abs: "100",  rel: "0",      floor_by_unit: true,  desc: "主表对主表"}
  NOTE_DETAIL:  {abs: "1000", rel: "0.0001", floor_by_unit: true,  desc: "涉及附注明细加总"}
  CROSS_YEAR:   {abs: "5",    rel: "0",      floor_by_unit: true,  desc: "跨期期初期末衔接"}
  REPORT_REF:   {abs: "0",    rel: "0.005",  floor_by_unit: false, desc: "研报引用（相对差异，审计 0.5%）"}

unit_floor:        # 半个披露单位
  "元":     "0.5"
  "千元":   "500"
  "万元":   "5000"
  "百万元": "50000"
  "亿元":   "500000"
